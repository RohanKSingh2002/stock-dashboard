<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Real-time stock dashboard: live watchlist, charts with indicators, key statistics and news." />
    <title>Market Desk</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='7' fill='%234850BE'/%3E%3Crect x='6.5' y='9' width='3' height='9' rx='1' fill='white'/%3E%3Crect x='11.5' y='6' width='3' height='10' rx='1' fill='white' opacity='.72'/%3E%3Crect x='16.5' y='11' width='3' height='9' rx='1' fill='white'/%3E%3C/svg%3E" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
